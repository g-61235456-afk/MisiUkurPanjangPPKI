<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Misi Unit Masa PPKI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#e8f5ff,#fff7df);color:#243447;min-height:100vh}
.app{max-width:720px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:900}.tools{display:flex;gap:6px}
.mini{border:2px solid #b8d7ee;background:white;border-radius:12px;padding:8px 10px;font-weight:900}
.volumePanel{display:flex;align-items:center;gap:10px;background:white;border:2px solid #cae3f5;border-radius:16px;padding:10px 12px;margin:10px 0}
.volumePanel label{font-weight:900;white-space:nowrap}.volumePanel input[type=range]{flex:1;min-width:0;accent-color:#1976d2;height:36px}.volumeValue{min-width:52px;text-align:right;font-weight:900;color:#0d47a1}
.card{background:white;border:2px solid #cae3f5;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 26px #1976d218}
.center{text-align:center}h1{font-size:29px;margin:8px 0}.lead{font-size:18px;line-height:1.45}
.btn{width:100%;border:0;border-radius:16px;padding:15px;margin:8px 0;font-size:19px;font-weight:900;min-height:56px}
.primary{background:#1976d2;color:white}.secondary{background:#ffca28;color:#382d00}.soft{background:#e8f4fd;color:#0d47a1}
.choice{background:white;border:3px solid #9fcdf0;color:#243447;text-align:left;box-shadow:none}.ok{background:#e8f5e9!important;border-color:#43a047!important}.bad{background:#ffebee!important;border-color:#ef5350!important}
.namebox{width:100%;padding:15px 16px;border:3px solid #9fcdf0;border-radius:16px;font-size:20px;font-weight:800;margin:10px 0;outline:none}.namebox:focus{border-color:#1976d2}
.err{color:#b71c1c;font-weight:800;min-height:22px}.chip{display:inline-block;background:#eaf5ff;border:2px solid #9fcdf0;border-radius:999px;padding:8px 12px;margin:4px;font-weight:900}
.note{background:#fff9d8;border:2px solid #efd45a;border-radius:15px;padding:13px;margin:10px 0;line-height:1.55;text-align:left}
.example{background:#edf8ee;border:2px solid #a5d6a7;border-radius:15px;padding:13px;margin:10px 0;line-height:1.5}
.rule{font-size:22px;font-weight:900;text-align:center;padding:12px;border-radius:15px;background:#f2f8fc;margin:8px 0}
.q{font-size:23px;font-weight:900;line-height:1.35;margin:14px 0}.status{display:flex;justify-content:space-between;gap:8px;font-weight:900}
.progress{height:13px;background:#e4edf4;border-radius:99px;overflow:hidden;margin:9px 0}.bar{height:100%;background:#42a5f5}
.feedback{border-radius:14px;padding:12px;margin:10px 0;font-weight:800;line-height:1.4}.green{background:#e8f5e9}.yellow{background:#fff3e0}
.bigNum{font-size:42px;font-weight:900;text-align:center;background:#f7fbff;border:2px dashed #90caf9;border-radius:18px;padding:18px;margin:12px 0}
.report{background:#f7fbff;border:2px solid #b9dcf5;border-radius:18px;padding:14px;text-align:left}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e4edf4}.row:last-child{border-bottom:0}
.achievement{font-size:22px;font-weight:900;color:#0d47a1}.stars{font-size:31px}.footer{text-align:center;font-size:12px;color:#687586;margin:16px 0}.big{font-size:118%}
</style>
</head>
<body>
<div class="app">
<div class="top"><div>⏱️ Misi Unit Masa</div><div class="tools"><button class="mini" onclick="speakNow()">🔊</button><button class="mini" id="musicBtn" onclick="toggleMusic()">🎵</button><button class="mini" onclick="document.body.classList.toggle('big')">A+</button></div></div>
<div class="volumePanel"><label for="volumeSlider">🔉 Muzik</label><input id="volumeSlider" type="range" min="0" max="100" step="5" value="70" oninput="setMusicVolume(this.value)" aria-label="Laraskan volume muzik latar"><span id="volumeValue" class="volumeValue">70%</span></div>
<div id="screen"></div>
<div class="footer">Matematik Tahun 6 PPKI • Saat, Minit dan Jam</div>
</div>
<script>
const questions=[
{q:'1 minit bersamaan berapa saat?',v:'1 minit = ? saat',a:['30 saat','60 saat','100 saat','120 saat'],c:1,h:'Ingat: 1 minit = 60 saat.',s:'Minit kepada saat'},
{q:'2 minit bersamaan berapa saat?',v:'2 × 60 saat',a:['60 saat','90 saat','120 saat','200 saat'],c:2,h:'2 × 60 = 120 saat.',s:'Minit kepada saat'},
{q:'3 minit bersamaan berapa saat?',v:'3 × 60 saat',a:['120 saat','180 saat','240 saat','300 saat'],c:1,h:'3 × 60 = 180 saat.',s:'Minit kepada saat'},
{q:'60 saat bersamaan berapa minit?',v:'60 saat = ? minit',a:['1 minit','2 minit','6 minit','10 minit'],c:0,h:'60 saat = 1 minit.',s:'Saat kepada minit'},
{q:'120 saat bersamaan berapa minit?',v:'120 ÷ 60',a:['1 minit','2 minit','3 minit','4 minit'],c:1,h:'120 ÷ 60 = 2 minit.',s:'Saat kepada minit'},
{q:'1 jam bersamaan berapa minit?',v:'1 jam = ? minit',a:['30 minit','60 minit','100 minit','120 minit'],c:1,h:'1 jam = 60 minit.',s:'Jam kepada minit'},
{q:'2 jam bersamaan berapa minit?',v:'2 × 60 minit',a:['60 minit','90 minit','120 minit','200 minit'],c:2,h:'2 × 60 = 120 minit.',s:'Jam kepada minit'},
{q:'3 jam bersamaan berapa minit?',v:'3 × 60 minit',a:['120 minit','150 minit','180 minit','300 minit'],c:2,h:'3 × 60 = 180 minit.',s:'Jam kepada minit'},
{q:'60 minit bersamaan berapa jam?',v:'60 minit = ? jam',a:['1 jam','2 jam','6 jam','10 jam'],c:0,h:'60 minit = 1 jam.',s:'Minit kepada jam'},
{q:'120 minit bersamaan berapa jam?',v:'120 ÷ 60',a:['1 jam','2 jam','3 jam','4 jam'],c:1,h:'120 ÷ 60 = 2 jam.',s:'Minit kepada jam'},
{q:'1 jam bersamaan berapa saat?',v:'60 minit × 60 saat',a:['600 saat','1,200 saat','3,600 saat','6,000 saat'],c:2,h:'1 jam = 60 minit. 60 × 60 = 3,600 saat.',s:'Jam dan saat'},
{q:'3,600 saat bersamaan berapa jam?',v:'3,600 saat = ? jam',a:['1 jam','2 jam','3 jam','6 jam'],c:0,h:'3,600 saat = 1 jam.',s:'Jam dan saat'},
{q:'Aina belajar 30 minit pada pagi dan 30 minit pada petang. Jumlah masa ialah...',v:'30 minit + 30 minit',a:['30 minit','45 minit','1 jam','2 jam'],c:2,h:'30 + 30 = 60 minit = 1 jam.',s:'Masalah harian'},
{q:'Satu aktiviti berlangsung selama 2 minit. Berapa saat?',v:'2 minit = ? saat',a:['60 saat','100 saat','120 saat','200 saat'],c:2,h:'2 × 60 = 120 saat.',s:'Masalah harian'},
{q:'Kelas berlangsung 1 jam 30 minit. Berapa minit semuanya?',v:'60 minit + 30 minit',a:['60 minit','90 minit','100 minit','130 minit'],c:1,h:'1 jam = 60 minit. 60 + 30 = 90 minit.',s:'Masalah harian'}
];
let i=0,score=0,done=false,studentName=localStorage.getItem('unitMasaName')||'',musicOn=false,audioCtx=null,masterGain=null,musicTimer=null,musicStep=0,skills={},musicVolume=Math.max(0,Math.min(1,parseFloat(localStorage.getItem('unitMasaVolume')||'0.70')));

function safe(s){return String(s||'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function home(){
 document.getElementById('screen').innerHTML=`<div class="card center"><div style="font-size:62px">⏱️🕒⭐</div><h1>Misi Saat, Minit & Jam</h1><p class="lead">Game mudah untuk belajar menukar unit masa.</p><div><span class="chip">SAAT</span><span class="chip">MINIT</span><span class="chip">JAM</span></div><div style="text-align:left;margin-top:14px"><b>👤 Nama Murid</b><input id="name" class="namebox" maxlength="40" placeholder="Taip nama murid" value="${safe(studentName)}"><div id="err" class="err"></div></div><button class="btn primary" onclick="begin()">▶️ MULA BERMAIN</button><button class="btn secondary" onclick="notes()">📚 NOTA & PANDUAN</button><div class="note"><b>15 soalan mudah.</b> Jawapan salah boleh cuba semula. Tekan 🔊 untuk dengar teks dan 🎵 untuk hidup/matikan muzik.</div></div>`;
}
function notes(){
 document.getElementById('screen').innerHTML=`<div class="card"><h1>📚 Nota & Panduan</h1>
 <div class="rule">60 saat = 1 minit</div><div class="rule">60 minit = 1 jam</div><div class="rule">1 jam = 3,600 saat</div>
 <div class="note"><b>➡️ Tukar unit BESAR kepada unit KECIL: DARAB</b><br>minit → saat: darab 60<br>jam → minit: darab 60</div>
 <div class="example"><b>Contoh 1:</b><br>2 minit = 2 × 60 = <b>120 saat</b></div>
 <div class="example"><b>Contoh 2:</b><br>3 jam = 3 × 60 = <b>180 minit</b></div>
 <div class="note"><b>⬅️ Tukar unit KECIL kepada unit BESAR: BAHAGI</b><br>saat → minit: bahagi 60<br>minit → jam: bahagi 60</div>
 <div class="example"><b>Contoh 3:</b><br>120 saat = 120 ÷ 60 = <b>2 minit</b></div>
 <div class="example"><b>Contoh 4:</b><br>120 minit = 120 ÷ 60 = <b>2 jam</b></div>
 <div class="note"><b>Tip mudah:</b><br>Kalau pergi ke unit yang lebih kecil → <b>DARAB 60</b>.<br>Kalau pergi ke unit yang lebih besar → <b>BAHAGI 60</b>.</div>
 <button class="btn primary" onclick="home()">👍 Saya Sudah Faham</button></div>`;
}
function begin(){
 const el=document.getElementById('name'),n=el?el.value.trim():'';
 if(!n){document.getElementById('err').innerText='Sila isi nama murid dahulu.';el.focus();return}
 studentName=n;localStorage.setItem('unitMasaName',studentName);start();
}
function start(){i=0;score=0;done=false;skills={};startMusic();render()}
function render(){
 done=false;const q=questions[i],pct=Math.round(i/questions.length*100);
 document.getElementById('screen').innerHTML=`<div class="card"><div class="status"><span>👤 ${safe(studentName)}</span><span>⭐ ${score}</span></div><div class="status" style="margin-top:6px"><span>Soalan ${i+1}/${questions.length}</span><span>Markah ${score}/${questions.length}</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="q">${q.q}</div><div class="bigNum">${q.v}</div><div>${q.a.map((x,k)=>`<button class="btn choice" onclick="answer(${k},this)">${String.fromCharCode(65+k)}. ${x}</button>`).join('')}</div><div id="fb"></div></div>`;
}
function answer(k,b){
 if(done)return;const q=questions[i];
 if(k===q.c){
  done=true;score++;skills[q.s]=(skills[q.s]||0)+1;b.classList.add('ok');goodSound();
  document.getElementById('fb').innerHTML=`<div class="feedback green">✅ Betul! Bagus!<br>${q.h}</div><button class="btn primary" onclick="next()">Seterusnya ➜</button>`;
 }else{
  b.classList.add('bad');if(navigator.vibrate)navigator.vibrate(80);
  document.getElementById('fb').innerHTML=`<div class="feedback yellow">💡 Cuba lagi.<br>${q.h}</div>`;
 }
}
function next(){i++;if(i>=questions.length){result();return}render()}
function result(){
 const pct=Math.round(score/questions.length*100);
 const stars=pct>=85?'⭐⭐⭐':pct>=60?'⭐⭐':'⭐';
 const level=pct>=85?'Cemerlang':pct>=60?'Baik':'Perlu Bimbingan';
 const msg=pct>=85?'Tahniah! Murid sudah sangat baik menukar unit masa.':pct>=60?'Bagus! Teruskan latihan supaya lebih yakin.':'Ulang nota dan cuba semula secara perlahan-lahan.';
 const cats=['Minit kepada saat','Saat kepada minit','Jam kepada minit','Minit kepada jam','Jam dan saat','Masalah harian'];
 let rows='';cats.forEach(s=>{const total=questions.filter(q=>q.s===s).length;rows+=`<div class="row"><span>${s}</span><b>${skills[s]||0}/${total}</b></div>`});
 localStorage.setItem('unitMasaLastResult',JSON.stringify({name:studentName,score,total:questions.length,percent:pct,achievement:level,date:new Date().toISOString()}));
 document.getElementById('screen').innerHTML=`<div class="card center"><div style="font-size:62px">🏆</div><h1>Keputusan Murid</h1><div class="stars">${stars}</div><div class="report"><div class="row"><span>👤 Nama</span><b>${safe(studentName)}</b></div><div class="row"><span>✅ Markah</span><b>${score} / ${questions.length}</b></div><div class="row"><span>📊 Peratus</span><b>${pct}%</b></div><div class="row"><span>🏅 Pencapaian</span><span class="achievement">${level}</span></div></div><p class="lead">${msg}</p><div class="card" style="text-align:left;box-shadow:none"><b>Ringkasan Kemahiran</b>${rows}</div><button class="btn primary" onclick="start()">🔁 Main Semula</button><button class="btn soft" onclick="home()">👤 Tukar Nama Murid</button><button class="btn secondary" onclick="notes()">📚 Ulang Nota</button></div>`;
}
function speakNow(){
 if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(document.getElementById('screen').innerText);u.lang='ms-MY';u.rate=.82;speechSynthesis.speak(u);
}
function ensureAudio(){
 if(!audioCtx){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=musicVolume;
  masterGain.connect(audioCtx.destination);
 }
}
function setMusicVolume(v){
 const n=Math.max(0,Math.min(100,Number(v)||0));musicVolume=n/100;localStorage.setItem('unitMasaVolume',String(musicVolume));
 const out=document.getElementById('volumeValue');if(out)out.innerText=n+'%';
 const slider=document.getElementById('volumeSlider');if(slider&&Number(slider.value)!==n)slider.value=n;
 if(audioCtx&&masterGain){masterGain.gain.setTargetAtTime(musicVolume,audioCtx.currentTime,.03)}
}
function playTone(freq,dur,vol,type){
 if(!musicOn)return;ensureAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+dur);
}
function startMusic(){
 if(musicOn)return;musicOn=true;document.getElementById('musicBtn').innerText='🎵';ensureAudio();if(audioCtx.state==='suspended')audioCtx.resume();
 const melody=[262,330,392,523,392,330,294,349,440,587,440,349];musicStep=0;
 function tick(){if(!musicOn)return;const f=melody[musicStep%melody.length];playTone(f,.42,.050,'sine');playTone(f/2,.42,.025,'triangle');setTimeout(()=>{if(musicOn)playTone(f*1.5,.16,.018,'sine')},180);musicStep++;musicTimer=setTimeout(tick,760)}
 tick();
}
function toggleMusic(){if(musicOn){musicOn=false;clearTimeout(musicTimer);document.getElementById('musicBtn').innerText='🔇'}else startMusic()}
function goodSound(){ensureAudio();const old=musicOn;musicOn=true;playTone(523,.13,.060,'triangle');setTimeout(()=>playTone(659,.16,.055,'triangle'),110);setTimeout(()=>playTone(784,.18,.050,'triangle'),220);musicOn=old}
setMusicVolume(Math.round(musicVolume*100));
home();
</script>
</body></html>
