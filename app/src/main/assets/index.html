<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Misi Masa & Waktu</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#eee8ff,#fff7eb);color:#243447}.app{max-width:700px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900}.tools{display:flex;gap:6px}.mini{border:2px solid #c9bce9;background:white;border-radius:12px;padding:8px}.card{background:white;border:2px solid #d9d0f2;border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #5e35b11a}.center{text-align:center}h1{font-size:28px;margin:8px 0}.lead{font-size:18px;line-height:1.4}.btn{width:100%;border:0;border-radius:16px;padding:15px;margin:8px 0;font-size:19px;font-weight:900;min-height:56px}.primary{background:#5e35b1;color:white}.soft{background:#eee7ff;color:#482a91}.choice{background:white;border:3px solid #beaee8;text-align:left}.ok{background:#e8f5e9!important;border-color:#43a047!important}.bad{background:#ffebee!important;border-color:#ef5350!important}.chip{display:inline-block;background:#f2ecff;border:2px solid #c8b8ec;border-radius:999px;padding:8px 12px;margin:4px;font-weight:900}.note{background:#fff8d7;border:2px solid #f0d45c;border-radius:14px;padding:12px;line-height:1.5}.q{font-size:23px;font-weight:900;line-height:1.35}.status{display:flex;justify-content:space-between;font-weight:900}.progress{height:12px;background:#eee7f8;border-radius:99px;overflow:hidden;margin:8px 0}.bar{height:100%;background:#7e57c2}.digital{display:inline-block;background:#27213d;color:white;border-radius:14px;padding:10px 17px;font-size:31px;font-weight:900}.clock{width:220px;height:220px;border:7px solid #3c2a64;border-radius:50%;margin:14px auto;position:relative;background:white}.num{position:absolute;transform:translate(-50%,-50%);font-weight:900}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px}.hour{width:8px;height:58px;background:#ff7043}.minute{width:6px;height:80px;background:#3949ab}.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#263238;left:50%;top:50%;transform:translate(-50%,-50%)}.legend{display:flex;align-items:center;gap:10px;border:2px solid #e1d8f5;border-radius:13px;padding:10px;margin:8px 0}.sample{width:44px;height:8px;border-radius:99px}.clockGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.clockChoice{border:3px solid #c5b5ea;border-radius:16px;background:white;padding:5px}.clockChoice canvas{width:100%;display:block}.feedback{border-radius:14px;padding:12px;margin:10px 0;font-weight:800;line-height:1.4}.green{background:#e8f5e9}.yellow{background:#fff3e0}.stars{font-size:30px}.big{font-size:118%}.namebox{width:100%;padding:15px 16px;border:3px solid #b9a6e5;border-radius:16px;font-size:20px;font-weight:800;margin:10px 0;outline:none}.namebox:focus{border-color:#5e35b1}.nameError{color:#b71c1c;font-weight:800;min-height:22px}.report{background:#f8f5ff;border:2px solid #cbbbea;border-radius:18px;padding:14px;margin:12px 0;text-align:left}.reportRow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #e6def5}.reportRow:last-child{border-bottom:0}.achievement{font-size:23px;font-weight:900;color:#4a2a8a}.footer{text-align:center;font-size:12px;color:#687586;margin:15px 0}@media(max-width:430px){.clock{width:205px;height:205px}.q{font-size:21px}}
</style></head><body><div class="app"><div class="top"><div>🕒 Misi Masa & Waktu</div><div class="tools"><button class="mini" onclick="speakNow()">🔊</button><button class="mini" id="music" onclick="toggleMusic()">🎵</button><button class="mini" onclick="document.body.classList.toggle('big')">A+</button></div></div><div id="screen"></div><div class="footer">Matematik Tahun 6 PPKI • Masalah Pembelajaran • Masa dan Waktu</div></div><script>
var qs=[
{t:'2:00',q:'Pukul 2:00. Jarum PANJANG berada pada nombor berapa?',a:['12','2','6','10'],c:0,h:'Minit 00: jarum panjang pada 12.',s:'Jarum minit'},
{t:'5:00',q:'Pukul 5:00. Jarum PENDEK berada pada nombor berapa?',a:['12','5','6','10'],c:1,h:'Jarum pendek menunjukkan JAM.',s:'Jarum jam'},
{t:'7:30',q:'Pukul 7:30. Jarum PANJANG berada pada nombor berapa?',a:['12','3','6','9'],c:2,h:'30 minit: jarum panjang pada 6.',s:'Jarum minit'},
{t:'8:30',q:'Pukul 8:30. Jarum PENDEK berada di mana?',a:['Tepat pada 8','Di antara 8 dan 9','Tepat pada 9','Pada 6'],c:1,h:'Setengah jam: jarum pendek bergerak ke arah jam berikutnya.',s:'Jarum jam'},
{t:'3:00',q:'Pilih jam yang menunjukkan pukul 3:00.',o:['3:00','6:00','3:30','9:00'],c:0,h:'Jarum panjang pada 12, jarum pendek pada 3.',s:'Padankan masa'},
{t:'6:30',q:'Pilih jam yang menunjukkan pukul 6:30.',o:['6:00','6:30','12:30','3:30'],c:1,h:'Jarum panjang pada 6, jarum pendek di antara 6 dan 7.',s:'Padankan masa'},
{t:'9:00',q:'Jam ini menunjukkan masa berapa?',r:1,a:['9:00','9:30','6:00','12:00'],c:0,h:'Jarum panjang pada 12, jarum pendek pada 9.',s:'Baca jam'},
{t:'4:30',q:'Jam ini menunjukkan masa berapa?',r:1,a:['4:00','4:30','5:30','6:30'],c:1,h:'Jarum panjang pada 6 bermaksud 30 minit.',s:'Baca jam'},
{t:'10:00',q:'Pukul 10:00. Jarum panjang perlu diletakkan pada ...',a:['10','12','6','5'],c:1,h:'Semua masa tepat (:00): jarum panjang pada 12.',s:'Jarum minit'},
{t:'1:00',q:'Pukul 1:00. Jarum pendek perlu diletakkan pada ...',a:['12','1','6','11'],c:1,h:'Jarum pendek menunjukkan nombor jam.',s:'Jarum jam'},
{t:'11:30',q:'Pilih jam yang menunjukkan pukul 11:30.',o:['11:00','12:30','11:30','5:30'],c:2,h:'Jarum panjang pada 6, jarum pendek di antara 11 dan 12.',s:'Padankan masa'},
{t:'2:30',q:'Jam ini menunjukkan masa berapa?',r:1,a:['2:00','2:30','3:30','6:30'],c:1,h:'Jarum panjang pada 6 = 30 minit.',s:'Baca jam'}];
var i=0,score=0,done=false,skills={},musicOn=false,ctx=null,timer=null,step=0,studentName=localStorage.getItem('studentName')||'';
function home(){document.getElementById('screen').innerHTML='<div class="card center"><div style="font-size:58px">🕒⭐</div><h1>Misi Masa & Waktu</h1><p class="lead">Belajar kedudukan jarum jam dengan cara mudah.</p><span class="chip">Jarum pendek = JAM</span><span class="chip">Jarum panjang = MINIT</span><div style="text-align:left;margin-top:14px"><b>👤 Nama Murid</b><input id="studentName" class="namebox" maxlength="40" placeholder="Taip nama murid di sini" value="'+safe(studentName)+'"><div id="nameError" class="nameError"></div></div><button class="btn primary" onclick="beginGame()">▶️ MULA BERMAIN</button><button class="btn soft" onclick="notes()">📚 NOTA RUJUKAN</button><div class="note">Mulakan dengan masa tepat <b>:00</b>, kemudian setengah jam <b>:30</b>. Jawapan salah boleh cuba semula.</div></div>'}
function notes(){document.getElementById('screen').innerHTML='<div class="card"><h1>📚 Nota Mudah</h1><div class="legend"><div class="sample" style="background:#ff7043"></div><div><b>Jarum pendek</b><br>Menunjukkan JAM.</div></div><div class="legend"><div class="sample" style="background:#3949ab"></div><div><b>Jarum panjang</b><br>Menunjukkan MINIT.</div></div><div class="note"><b>3:00</b><br>Jarum panjang pada 12.<br>Jarum pendek pada 3.</div>'+clock('3:00')+'<div class="note"><b>4:30</b><br>Jarum panjang pada 6.<br>Jarum pendek di antara 4 dan 5.</div>'+clock('4:30')+'<div class="note"><b>Ingat:</b><br>:00 → jarum panjang pada 12<br>:30 → jarum panjang pada 6</div><button class="btn primary" onclick="home()">Saya Sudah Bersedia 👍</button><button class="btn soft" onclick="home()">⬅ Kembali</button></div>'}
function safe(s){return String(s||'').replace(/[&<>"']/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function beginGame(){var el=document.getElementById('studentName'),n=el?el.value.trim():studentName.trim();if(!n){document.getElementById('nameError').innerText='Sila isi nama murid dahulu.';if(el)el.focus();return}studentName=n;localStorage.setItem('studentName',studentName);start()}
function start(){if(!studentName){home();return}i=0;score=0;skills={};startMusic();render()}
function ang(t){var p=t.split(':'),h=+p[0],m=+p[1];return{m:m*6,h:(h%12)*30+m*.5}}
function clock(t){var a=ang(t),n='',x,y,r;for(var k=1;k<=12;k++){r=k*30*Math.PI/180;x=50+39*Math.sin(r);y=50-39*Math.cos(r);n+='<span class="num" style="left:'+x+'%;top:'+y+'%">'+k+'</span>'}return '<div class="clock">'+n+'<div class="hand hour" style="transform:translateX(-50%) rotate('+a.h+'deg)"></div><div class="hand minute" style="transform:translateX(-50%) rotate('+a.m+'deg)"></div><div class="dot"></div></div>'}
function render(){done=false;var q=qs[i],p=Math.round(i/qs.length*100),v='<div class="center"><div class="digital">'+q.t+'</div></div>',a='';if(q.o){a='<div class="clockGrid">';for(var k=0;k<q.o.length;k++)a+='<button class="clockChoice" onclick="answer('+k+',this)"><canvas width="210" height="210" data-time="'+q.o[k]+'"></canvas></button>';a+='</div>'}else{if(q.r)v=clock(q.t);for(var k=0;k<q.a.length;k++)a+='<button class="btn choice" onclick="answer('+k+',this)">'+String.fromCharCode(65+k)+'. '+q.a[k]+'</button>'}document.getElementById('screen').innerHTML='<div class="card"><div class="status"><span>👤 '+safe(studentName)+'</span><span>⭐ '+score+'</span></div><div class="status" style="margin-top:6px"><span>Soalan '+(i+1)+'/'+qs.length+'</span><span>Skor '+score+'/'+qs.length+'</span></div><div class="progress"><div class="bar" style="width:'+p+'%"></div></div><div class="q">'+q.q+'</div>'+v+a+'<div id="fb"></div></div>';drawAll()}
function answer(k,b){if(done)return;var q=qs[i];if(k===q.c){done=true;score++;skills[q.s]=(skills[q.s]||0)+1;b.classList.add('ok');good();document.getElementById('fb').innerHTML='<div class="feedback green">✅ Betul! Bagus!<br>'+q.h+'</div><button class="btn primary" onclick="next()">Seterusnya ➜</button>'}else{b.classList.add('bad');if(navigator.vibrate)navigator.vibrate(70);document.getElementById('fb').innerHTML='<div class="feedback yellow">💡 Cuba lagi.<br>'+q.h+'</div>'}}
function next(){i++;if(i>=qs.length){result();return}render()}
function result(){var p=Math.round(score/qs.length*100),st=p>=85?'⭐⭐⭐':p>=60?'⭐⭐':'⭐',level=p>=85?'Cemerlang':p>=60?'Baik':'Perlu Bimbingan',m=p>=85?'Tahniah! Murid sudah sangat baik mengenal masa dan kedudukan jarum jam.':p>=60?'Bagus! Teruskan latihan supaya lebih yakin.':'Ulang nota dan cuba semula secara perlahan-lahan.';var all=['Jarum minit','Jarum jam','Padankan masa','Baca jam'],s='';for(var j=0;j<all.length;j++){var total=qs.filter(function(q){return q.s===all[j]}).length;s+='<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>'+all[j]+'</span><b>'+(skills[all[j]]||0)+'/'+total+'</b></div>'}var report={name:studentName,score:score,total:qs.length,percent:p,achievement:level,skills:skills,date:new Date().toISOString()};localStorage.setItem('lastResult',JSON.stringify(report));document.getElementById('screen').innerHTML='<div class="card center"><div style="font-size:58px">🏆</div><h1>Keputusan Murid</h1><div class="stars">'+st+'</div><div class="report"><div class="reportRow"><span>👤 Nama</span><b>'+safe(studentName)+'</b></div><div class="reportRow"><span>✅ Markah</span><b>'+score+' / '+qs.length+'</b></div><div class="reportRow"><span>📊 Peratus</span><b>'+p+'%</b></div><div class="reportRow"><span>🏅 Pencapaian</span><span class="achievement">'+level+'</span></div></div><p class="lead">'+m+'</p><div class="card" style="text-align:left;box-shadow:none"><b>Ringkasan Kemahiran</b>'+s+'</div><button class="btn primary" onclick="start()">🔁 Main Semula</button><button class="btn soft" onclick="home()">👤 Tukar Nama Murid</button><button class="btn soft" onclick="notes()">📚 Ulang Nota</button></div>'}
function drawAll(){var cs=document.querySelectorAll('canvas[data-time]');for(var j=0;j<cs.length;j++)draw(cs[j],cs[j].getAttribute('data-time'))}
function draw(c,t){var x=c.getContext('2d'),w=c.width,z=w/2,r=w*.42,a=ang(t);x.clearRect(0,0,w,w);x.lineWidth=7;x.strokeStyle='#3c2a64';x.fillStyle='white';x.beginPath();x.arc(z,z,r,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#243447';x.font='bold 17px Arial';x.textAlign='center';x.textBaseline='middle';for(var k=1;k<=12;k++){var d=k*30*Math.PI/180;x.fillText(k,z+Math.sin(d)*r*.76,z-Math.cos(d)*r*.76)}hand(x,z,z,r*.48,a.h,'#ff7043',8);hand(x,z,z,r*.68,a.m,'#3949ab',6);x.fillStyle='#263238';x.beginPath();x.arc(z,z,7,0,Math.PI*2);x.fill()}
function hand(x,cx,cy,l,d,col,w){var a=(d-90)*Math.PI/180;x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*l,cy+Math.sin(a)*l);x.stroke()}
function speakNow(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(document.getElementById('screen').innerText);u.lang='ms-MY';u.rate=.82;speechSynthesis.speak(u)}
function audio(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,v,type){if(!musicOn&&type!=='triangle')return;audio();var o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.012,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(d||.25));o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+(d||.25))}
function startMusic(){if(musicOn)return;musicOn=true;document.getElementById('music').innerText='🎵';audio();if(ctx.state==='suspended')ctx.resume();var n=[262,330,392,330,294,349,440,349];step=0;function tick(){if(!musicOn)return;tone(n[step%n.length],.38,.026,'sine');tone(n[step%n.length]/2,.38,.010,'triangle');step++;timer=setTimeout(tick,900)}tick()}
function toggleMusic(){if(musicOn){musicOn=false;clearTimeout(timer);document.getElementById('music').innerText='🔇'}else startMusic()}
function good(){audio();var old=musicOn;musicOn=true;tone(523,.14,.045,'triangle');setTimeout(function(){tone(659,.18,.040,'triangle')},110);musicOn=old}
home();
</script></body></html>
